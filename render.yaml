services:
  - type: web
    name: vachan-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vachan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: EVENT_SIGNING_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: vachan-db
    plan: free
    databaseName: vachan
    user: vachan
